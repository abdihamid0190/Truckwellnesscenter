# Builds the phone app on Expo's servers, so no computer is needed.
# Run it from GitHub: Actions > Build app > Run workflow.
# Needs an EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens).
name: Build app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which phones to build for
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: preview = Android file you can install directly; production = for the stores
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Links to the trucker-wellness project on expo.dev, creating it if needed.
      # Each step repeats its last lines as an error note, so a failure is readable
      # from the run's summary without opening the full log.
      - run: |
          set -o pipefail
          eas init --non-interactive --force 2>&1 | tee eas.log || { echo "::error title=eas init failed::$(tail -15 eas.log | tr '\n' ' ')"; exit 1; }
      - run: |
          set -o pipefail
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait 2>&1 | tee eas.log || { echo "::error title=eas build failed::$(tail -15 eas.log | tr '\n' ' ')"; exit 1; }
